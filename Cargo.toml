[package]
name = "ifhai"
version = "0.1.0"
edition = "2024"
description = "Makes a downloaded AppImage just work: install, update, remove"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
